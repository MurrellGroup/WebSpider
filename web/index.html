<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <meta name="description" content="WebSpider distributed agent control plane">
    <title>WebSpider</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/vendor/xterm.css">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <section id="login-view" class="login-view hidden" aria-labelledby="login-title">
      <div class="login-mark" aria-hidden="true">
        <img src="/icon.svg" alt="">
      </div>
      <div class="login-panel">
        <p class="eyebrow">PRIVATE CONTROL PLANE</p>
        <h1 id="login-title">Enter WebSpider</h1>
        <p class="muted">Use the owner token printed by the hub. It is exchanged for a private, HTTP-only browser session.</p>
        <form id="login-form">
          <label for="owner-token">Owner token</label>
          <input id="owner-token" name="token" type="password" autocomplete="current-password" spellcheck="false" required>
          <button class="primary wide" type="submit">Open portal</button>
          <p id="login-error" class="form-error" role="alert"></p>
        </form>
      </div>
    </section>

    <div id="app-shell" class="app-shell hidden">
      <aside class="sidebar">
        <header class="brand">
          <img src="/icon.svg" alt="">
          <div><strong>WebSpider</strong><span>fabric console</span></div>
          <span class="connection-dot" id="connection-dot" title="Live event stream"></span>
        </header>
        <button class="nav-master selected" data-action="home">
          <span class="nav-icon">⌁</span>
          <span><strong>Master Spider</strong><small>Operational overview</small></span>
        </button>
        <div class="sidebar-label"><span>Projects &amp; agents</span><button data-action="refresh" title="Refresh">↻</button></div>
        <nav id="project-tree" class="project-tree" aria-label="Projects and agents"></nav>
        <footer class="sidebar-footer">
          <button data-action="show-nodes"><span>◫</span> Nodes</button>
          <button data-action="show-audit"><span>≣</span> Audit</button>
          <button data-action="logout"><span>↪</span> Sign out</button>
        </footer>
      </aside>

      <main id="main-view" class="main-view" tabindex="-1"></main>

      <aside id="attention-panel" class="attention-panel" aria-label="Attention items"></aside>

      <nav class="mobile-nav" aria-label="Main navigation">
        <button data-action="home"><span>⌁</span>Master</button>
        <button data-action="mobile-agents"><span>◉</span>Agents</button>
        <button data-action="show-tasks"><span>◇</span>Tasks</button>
        <button data-action="show-attention"><span>!</span>Attention</button>
        <button data-action="show-more"><span>•••</span>More</button>
      </nav>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
